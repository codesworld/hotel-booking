# Starts the whole system:  docker compose up --build
#
# Configuration comes from an env file. Default: .env.test (test hooks enabled).
# Use another one with:     ENV_FILE=.env.dev docker compose up --build
# Host ports can be changed with POSTGRES_HOST_PORT / BOOKING_API_HOST_PORT /
# PAYMENT_SERVICE_HOST_PORT / FRONTEND_HOST_PORT.
# UI: http://localhost:5173
name: hotel-booking

services:
  postgres:
    image: postgres:16-alpine
    env_file: ${ENV_FILE:-.env.test}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  booking-api:
    build: ./services/booking-api
    env_file: ${ENV_FILE:-.env.test}
    environment:
      # Inside Docker, the API reaches Postgres by its service name on the internal port.
      DB_HOST: postgres
      DB_PORT: "5432"
      PORT: "3000"
    ports:
      - "${BOOKING_API_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  payment-service:
    build: ./services/payment-service
    env_file: ${ENV_FILE:-.env.test}
    environment:
      PORT: "4000"
    ports:
      - "${PAYMENT_SERVICE_HOST_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s

  frontend:
    build: ./frontend
    environment:
      # nginx forwards /api/* here (service name on the internal Docker network).
      BOOKING_API_URL: http://booking-api:3000
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      booking-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
